name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the run already in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The two jobs below have no dependency on each other, so they run in parallel.
jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      # Optional: without the secret the build still succeeds, just with an empty ESV key.
      - name: Write local.properties
        env:
          ESV_API_KEY: ${{ secrets.ESV_API_KEY }}
        run: echo "ESV_API_KEY=$ESV_API_KEY" > local.properties

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - uses: actions/upload-artifact@v7
        with:
          name: android-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  ios:
    name: iOS
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      # Kotlin/Native downloads its toolchain and dependencies into ~/.konan; caching it saves
      # several minutes per run.
      - uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Write local.properties
        env:
          ESV_API_KEY: ${{ secrets.ESV_API_KEY }}
        run: echo "ESV_API_KEY=$ESV_API_KEY" > local.properties

      - name: Run shared tests
        run: ./gradlew :shared:allTests

      # Unsigned simulator build: verifies the app compiles and links without needing
      # signing certificates in CI. ARCHS=arm64 because shared/ only targets
      # iosSimulatorArm64 — a generic destination otherwise asks for x86_64 too, and the
      # Compose resource sync fails.
      - name: Build iOS app (simulator)
        run: |
          xcodebuild build \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO
